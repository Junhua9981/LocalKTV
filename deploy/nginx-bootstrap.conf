# Use for the FIRST certificate issuance only; the app is never served over HTTP.
# Replace YOUR_PUBLIC_IP, then install in /etc/nginx/sites-available/localktv.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_PUBLIC_IP;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 404; }
}
