# Replace EVERY YOUR_PUBLIC_IP. Certbot --cert-name localktv creates these paths.
# LocalKTV lives under /ktv/ (KTV_BASE_PATH=/ktv); change every /ktv here to match.
limit_req_zone $binary_remote_addr zone=ktv_login:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_PUBLIC_IP;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 308 https://YOUR_PUBLIC_IP$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/localktv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localktv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Overwrite forwarding headers; never accept a caller's forged client IP.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    location = /ktv/auth/login {
        client_max_body_size 4k;
        limit_req zone=ktv_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /ktv/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /ktv {
        # All static/media/API requests pass through the application's login gate.
        # No URI on proxy_pass: the app receives /ktv/... and strips the prefix itself.
        proxy_pass http://127.0.0.1:8080;
    }
    location / { return 404; }
}
